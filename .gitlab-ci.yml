image: 
  name: hashicorp/terraform:latest
  entrypoint: [""]
variables:
  TF_VAR_ssh_public_key: $SSH_PUBLIC_KEY
  TF_VAR_ssh_private_key: $SSH_PRIVATE_KEY

stages:
  - validate
  - plan
  - apply

validate:
  stage: validate
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate
plan:
  stage: plan
  script:
      - terraform init
      - terraform plan
apply:
  stage: apply
  script:
    - terraform init
    - terraform apply -auto-approve
  when: manual


