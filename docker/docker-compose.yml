services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
#    ports:               //after using nginx it not necassary 
#     - "3000:3000"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./node-exporter-dashboard.json:/var/lib/grafana/dashboards/node-exporter-dashboard.json
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=http://cloud-telemetry.click

      
  node_exporter: 
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  prometheus_data:
  grafana_data:
  