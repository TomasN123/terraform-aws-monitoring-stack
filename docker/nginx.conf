server {
    listen 80;
    server_name cloud-telemetry.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;

    resolver 127.0.0.11 valid=30s;
    set $upstream_grafana grafana;

    ssl_certificate     /etc/letsencrypt/live/cloud-telemetry.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud-telemetry.click/privkey.pem;

    location / {
        proxy_pass http://$upstream_grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
